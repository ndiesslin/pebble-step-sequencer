<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pebble Steps</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101318; color: #f7f8fa; }
    body { margin: 0 auto; max-width: 38rem; padding: 1.25rem; }
    h1 { margin: 0; } p { color: #bac1cc; }
    .track { display: grid; grid-template-columns: 3rem repeat(16, minmax(0, 1fr)); gap: .2rem; align-items: center; margin: 1rem 0; }
    .track label { font-weight: 700; } button { min-height: 2.35rem; border: 0; border-radius: .3rem; background: #303744; color: white; font-size: .7rem; }
    button.active { background: #00a8ff; color: #07121a; } .track:nth-of-type(3) button.active { background: #fcaf17; }
    .track:nth-of-type(4) button.active { background: #17b978; } .track:nth-of-type(5) button.active { background: #ed4b82; }
    .tempo { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; } input { flex: 1; }
    #save { width: 100%; background: #00a8ff; color: #07121a; font-weight: 800; }
  </style>
</head>
<body>
  <h1>Pebble Steps</h1><p>Edit all 16 steps, then save them to your watch.</p>
  <main id="tracks"></main>
  <div class="tempo"><label for="bpm">Tempo <output id="tempo-value">120</output> BPM</label><input id="bpm" type="range" min="60" max="240" step="5" value="120"></div>
  <button id="save">Save to Pebble</button>
  <script>
    const names = ['C4', 'E4', 'G4', 'C5'];
    const returnTo = new URLSearchParams(location.search).get('return_to') || 'pebblejs://close#';
    let state = {};
    try { state = JSON.parse(new URLSearchParams(location.search).get('state') || '{}'); } catch (_) {}
    const tracks = document.querySelector('#tracks');
    names.forEach((name, track) => {
      const row = document.createElement('section'); row.className = 'track';
      const label = document.createElement('label'); label.textContent = name; row.append(label);
      for (let step = 0; step < 16; step++) {
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = step + 1; button.dataset.step = step;
        button.classList.toggle('active', Boolean((state['Pattern' + track] || 0) & (1 << step));
        button.onclick = () => button.classList.toggle('active'); row.append(button);
      }
      tracks.append(row);
    });
    const bpm = document.querySelector('#bpm'), tempo = document.querySelector('#tempo-value');
    bpm.value = state.Bpm || 120; tempo.value = bpm.value; bpm.oninput = () => tempo.value = bpm.value;
    document.querySelector('#save').onclick = () => {
      const result = { Bpm: Number(bpm.value) };
      document.querySelectorAll('.track').forEach((row, track) => {
        result['Pattern' + track] = [...row.querySelectorAll('button.active')].reduce((value, button) => value | (1 << button.dataset.step), 0);
      });
      location.href = returnTo + encodeURIComponent(JSON.stringify(result));
    };
  </script>
</body>
</html>
