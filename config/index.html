<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pebble Studio</title>
  <style>
    body { margin: 0 auto; max-width: 38rem; padding: 1.25rem; background: #101318; color: #f7f8fa; font-family: sans-serif; }
    h1 { margin: 0; } p { color: #bac1cc; } .notice { min-height: 1.2em; font-size: .9rem; }
    .track { display: table; width: 100%; border-spacing: .2rem; margin: 1rem 0; table-layout: fixed; }
    .track label, .step { display: table-cell; } .track label { width: 3rem; font-weight: bold; vertical-align: middle; }
    .step.beat { border-left: 2px solid #8b95a5; padding-left: .12rem; }
    button { min-height: 2.35rem; width: 100%; border: 0; border-radius: .3rem; background: #303744; color: white; font-size: .7rem; }
    .track-0 button.active { background: #d42d27; } .track-1 button.active { background: #e88916; }
    .track-2 button.active { background: #168a57; } .track-3 button.active { background: #007caa; }
    .track-4 button.active { background: #8547c7; } .track-5 button.active { background: #008fc4; }
    .pitch { margin-top: -.75rem; } .pitch button { background: #252a33; color: #d9dfeb; font-size: .62rem; }
    .tempo { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; } input { flex: 1; }
    #transport, #save { background: #00a8ff; color: #07121a; font-weight: bold; font-size: 1rem; }
    #transport { margin: .5rem 0; background: #ffc400; }
  </style>
</head>
<body>
  <h1>Pebble Studio</h1><p>Edit every sequence, synth pitch, tempo, and transport state.</p>
  <p class="notice" id="notice">Keep Pebble Studio open on your watch while saving.</p><div id="tracks"></div>
  <div class="tempo"><label for="bpm">Tempo <output id="tempo-value">120</output> BPM</label><input id="bpm" type="range" min="60" max="240" step="5" value="120"></div>
  <button id="transport" type="button">Start playback</button><button id="save">Save to Pebble</button>
  <script>
    function getParam(name) { var q = location.search.substring(1).split('&'), i, pair; for (i = 0; i < q.length; i++) { pair = q[i].split('='); if (decodeURIComponent(pair[0]) === name) return decodeURIComponent((pair[1] || '').replace(/\+/g, ' ')); } return ''; }
    function hasClass(node, name) { return (' ' + node.className + ' ').indexOf(' ' + name + ' ') !== -1; }
    function toggleClass(node, name) { node.className = hasClass(node, name) ? node.className.replace(new RegExp('(^|\\s)' + name + '(?=\\s|$)', 'g'), ' ').replace(/^\s+|\s+$/g, '') : node.className + ' ' + name; }
    var names = ['Kick', 'Snare', 'Hi-hat', 'Rim', 'Bass', 'Lead'], noteNames = [['C2', 'D2', 'E2', 'G2', 'A2', 'B2', 'C3'], ['C3', 'D3', 'E3', 'G3', 'A3', 'B3', 'C4']], state = {}, tracks = document.getElementById('tracks'), returnTo = getParam('return_to') || 'pebblejs://close#', track, step, row, label, cell, button, pitchRows = [], synthNotes = [], playing;
    try { state = JSON.parse(getParam('state') || '{}'); } catch (error) { state = {}; }
    for (track = 0; track < 2; track++) { synthNotes[track] = (/^[0-6]{16}$/.test(state['SynthNotes' + track] || '') ? state['SynthNotes' + track] : '0000000000000000').split(''); }
    if (getParam('source') === 'cached') document.getElementById('notice').innerHTML = 'Watch unavailable — editing the last saved phone copy.';
    for (track = 0; track < names.length; track++) {
      row = document.createElement('div'); row.className = 'track track-' + track;
      label = document.createElement('label'); label.innerHTML = names[track]; row.appendChild(label);
      for (step = 0; step < 16; step++) {
        cell = document.createElement('span'); cell.className = 'step' + (step > 0 && step % 4 === 0 ? ' beat' : ''); button = document.createElement('button');
        button.type = 'button'; button.innerHTML = step + 1; button.setAttribute('data-step', step);
        if ((state[track < 4 ? 'Pattern' + track : 'Synth' + (track - 4)] || 0) & (1 << step)) button.className = 'active';
        button.onclick = function () { toggleClass(this, 'active'); }; cell.appendChild(button); row.appendChild(cell);
      }
      tracks.appendChild(row);
      if (track >= 4) {
        row = document.createElement('div'); row.className = 'track pitch';
        label = document.createElement('label'); label.innerHTML = 'Pitch'; row.appendChild(label);
        for (step = 0; step < 16; step++) {
          cell = document.createElement('span'); cell.className = 'step' + (step > 0 && step % 4 === 0 ? ' beat' : ''); button = document.createElement('button');
          button.type = 'button'; button.setAttribute('data-track', track - 4); button.setAttribute('data-step', step);
          button.innerHTML = noteNames[track - 4][Number(synthNotes[track - 4][step])];
          button.onclick = function () { var t = Number(this.getAttribute('data-track')), s = Number(this.getAttribute('data-step')), n = (Number(synthNotes[t][s]) + 1) % noteNames[t].length; synthNotes[t][s] = n; this.innerHTML = noteNames[t][n]; };
          cell.appendChild(button); row.appendChild(cell);
        }
        tracks.appendChild(row);
      }
    }
    var bpm = document.getElementById('bpm'), tempo = document.getElementById('tempo-value'); bpm.value = state.Bpm || 120; tempo.innerHTML = bpm.value;
    bpm.onchange = bpm.oninput = function () { tempo.innerHTML = bpm.value; };
    playing = Number(state.Transport) === 1;
    var transport = document.getElementById('transport');
    function renderTransport() { transport.innerHTML = playing ? 'Stop playback' : 'Start playback'; }
    renderTransport(); transport.onclick = function () { playing = !playing; saveToPebble(); };
    function saveToPebble() {
      var result = { Bpm: Number(bpm.value), Transport: playing ? 1 : 0 }, rows = tracks.getElementsByTagName('div.track'), buttons, value, i, j, sequenceRow = 0;
      for (i = 0; i < rows.length; i++) { if (hasClass(rows[i], 'pitch')) continue; buttons = rows[i].getElementsByTagName('button'); value = 0; for (j = 0; j < buttons.length; j++) if (hasClass(buttons[j], 'active')) value |= (1 << Number(buttons[j].getAttribute('data-step'))); result[sequenceRow < 4 ? 'Pattern' + sequenceRow : 'Synth' + (sequenceRow - 4)] = value; sequenceRow++; }
      result.SynthNotes0 = synthNotes[0].join(''); result.SynthNotes1 = synthNotes[1].join('');
      location.href = returnTo + encodeURIComponent(JSON.stringify(result));
    }
    document.getElementById('save').onclick = saveToPebble;
  </script>
</body>
</html>
