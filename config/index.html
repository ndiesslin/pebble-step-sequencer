<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pebble Studio</title>
  <link rel="icon" type="image/png" sizes="180x180" href="assets/icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon.png">
  <style>
    body { margin: 0 auto; max-width: 38rem; padding: 1rem; background: #101318; color: #f7f8fa; font-family: sans-serif; }
    h1 { margin: 0; } p { color: #bac1cc; } .notice { min-height: 1.2em; font-size: .9rem; }
    .track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .35rem; width: 100%; margin: 1.15rem 0; }
    .track label { grid-column: 1 / -1; font-weight: bold; font-size: .9rem; letter-spacing: .05em; }
    .step { min-width: 0; } .step.beat { border-top: 2px solid #8b95a5; padding-top: .2rem; }
    button { min-height: 3rem; width: 100%; border: 0; border-radius: .4rem; background: #303744; color: white; font-size: .9rem; font-weight: bold; }
    button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
    .track-0 button.active { background: #d42d27; } .track-1 button.active { background: #e88916; }
    .track-2 button.active { background: #168a57; } .track-3 button.active { background: #007caa; }
    .track-4 button.active { background: #8547c7; } .track-5 button.active { background: #008fc4; }
    .pitch { margin-top: -.7rem; } .pitch button { background: #252a33; color: #d9dfeb; font-size: .78rem; }
    .presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; margin: 1rem 0; }
    .presets button { min-height: 2.6rem; background: #252a33; font-size: .82rem; }
    .presets #clear { background: #632a32; }
    .tempo { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; } input { flex: 1; }
    .routing { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: -.75rem 0 1.25rem; }
    .routing label { display: flex; align-items: center; gap: .3rem; color: #d9dfeb; font-size: .85rem; }
    #transport, #close { background: #00a8ff; color: #07121a; font-weight: bold; font-size: 1rem; }
    #transport { margin: .5rem 0; background: #ffc400; }
    #close { margin-top: .5rem; background: #68db91; }
  </style>
</head>
<body>
  <h1>Pebble Studio</h1><p>Edit sequences, synth pitch and tone, transport, effects, and their routing.</p>
  <p class="notice" id="notice">Keep Pebble Studio open on your watch while saving.</p>
  <div class="presets" id="presets"><button type="button" data-preset="four">Four on the floor</button><button type="button" data-preset="electro">Electro pulse</button><button type="button" data-preset="melody">Melody sketch</button><button id="clear" type="button">Clear all notes</button></div>
  <div id="tracks"></div>
  <div class="tempo"><label for="bpm">Tempo <output id="tempo-value">120</output> BPM</label><input id="bpm" type="range" min="60" max="240" step="5" value="120"></div>
  <div class="tempo"><label for="volume">Volume <output id="volume-value">90</output></label><input id="volume" type="range" min="0" max="100" step="5" value="90"></div>
  <div class="tempo"><label for="drive">Drive <output id="drive-value">0</output></label><input id="drive" type="range" min="0" max="100" step="5" value="0"></div>
  <div class="tempo"><label for="space">Space <output id="space-value">0</output></label><input id="space" type="range" min="0" max="100" step="5" value="0"></div>
  <h2>Synth Shape</h2>
  <div class="tempo"><label for="bass-cutoff">Bass Attack <output id="bass-cutoff-value">10</output></label><input id="bass-cutoff" type="range" min="0" max="100" step="5" value="10"></div>
  <div class="tempo"><label for="bass-bite">Bass Decay <output id="bass-bite-value">50</output></label><input id="bass-bite" type="range" min="0" max="100" step="5" value="50"></div>
  <div class="tempo"><label for="lead-cutoff">Lead Attack <output id="lead-cutoff-value">5</output></label><input id="lead-cutoff" type="range" min="0" max="100" step="5" value="5"></div>
  <div class="tempo"><label for="lead-bite">Lead Decay <output id="lead-bite-value">65</output></label><input id="lead-bite" type="range" min="0" max="100" step="5" value="65"></div>
  <h2>Effect Routing</h2><p>Volume remains master; choose which groups receive Drive and Space.</p>
  <label>Drive</label><div class="routing" id="drive-targets"></div>
  <label>Space</label><div class="routing" id="space-targets"></div>
  <button id="transport" type="button">Start playback</button><button id="close" type="button">Save &amp; Close</button>
  <script>
    function getParam(name) { var q = location.search.substring(1).split('&'), i, pair; for (i = 0; i < q.length; i++) { pair = q[i].split('='); if (decodeURIComponent(pair[0]) === name) return decodeURIComponent((pair[1] || '').replace(/\+/g, ' ')); } return ''; }
    function hasClass(node, name) { return (' ' + node.className + ' ').indexOf(' ' + name + ' ') !== -1; }
    function toggleClass(node, name) { node.className = hasClass(node, name) ? node.className.replace(new RegExp('(^|\\s)' + name + '(?=\\s|$)', 'g'), ' ').replace(/^\s+|\s+$/g, '') : node.className + ' ' + name; }
    var names = ['Kick', 'Snare', 'Hi-hat', 'Rim', 'Bass', 'Lead'], noteNames = [['C4', 'D4', 'E4', 'G4', 'A4', 'B4', 'C5'], ['C5', 'D5', 'E5', 'G5', 'A5', 'B5', 'C6']], state = {}, tracks = document.getElementById('tracks'), returnTo = getParam('return_to') || 'pebblejs://close#', track, step, row, label, cell, button, sequenceRows = [], pitchButtons = [[], []], synthNotes = [], playing, transportTouched = false;
    try { state = JSON.parse(getParam('state') || '{}'); } catch (error) { state = {}; }
    for (track = 0; track < 2; track++) { synthNotes[track] = (/^[0-6]{16}$/.test(state['SynthNotes' + track] || '') ? state['SynthNotes' + track] : '0000000000000000').split(''); }
    var cachedState = getParam('source') === 'cached';
    if (cachedState) document.getElementById('notice').textContent = 'Watch unavailable — the saved phone copy is view-only. Close Settings, reconnect the watch, then reopen.';
    if (getParam('source') === 'phone') document.getElementById('notice').textContent = 'Editing the saved phone copy. Save sends it to Pebble Studio on your open watch.';
    if (getParam('notice')) document.getElementById('notice').textContent = getParam('notice');
    for (track = 0; track < names.length; track++) {
      row = document.createElement('div'); row.className = 'track track-' + track;
      label = document.createElement('label'); label.textContent = names[track]; row.appendChild(label);
      for (step = 0; step < 16; step++) {
        cell = document.createElement('span'); cell.className = 'step' + (step >= 4 ? ' beat' : ''); button = document.createElement('button');
        button.type = 'button'; button.textContent = step + 1; button.setAttribute('data-step', step);
        if ((state[track < 4 ? 'Pattern' + track : 'Synth' + (track - 4)] || 0) & (1 << step)) button.className = 'active';
        button.onclick = function () { toggleClass(this, 'active'); }; cell.appendChild(button); row.appendChild(cell);
      }
      sequenceRows.push(row);
      tracks.appendChild(row);
      if (track >= 4) {
        row = document.createElement('div'); row.className = 'track pitch';
        label = document.createElement('label'); label.textContent = 'Pitch'; row.appendChild(label);
        for (step = 0; step < 16; step++) {
          cell = document.createElement('span'); cell.className = 'step' + (step >= 4 ? ' beat' : ''); button = document.createElement('button');
          button.type = 'button'; button.setAttribute('data-track', track - 4); button.setAttribute('data-step', step);
          button.textContent = noteNames[track - 4][Number(synthNotes[track - 4][step])];
          button.onclick = function () { var t = Number(this.getAttribute('data-track')), s = Number(this.getAttribute('data-step')), n = (Number(synthNotes[t][s]) + 1) % noteNames[t].length; synthNotes[t][s] = n; this.textContent = noteNames[t][n]; };
          pitchButtons[track - 4].push(button);
          cell.appendChild(button); row.appendChild(cell);
        }
        tracks.appendChild(row);
      }
    }
    var bpm = document.getElementById('bpm'), tempo = document.getElementById('tempo-value'); bpm.value = state.Bpm || 120; tempo.textContent = bpm.value;
    bpm.onchange = bpm.oninput = function () { tempo.textContent = bpm.value; };
    var volume = document.getElementById('volume'), volumeValue = document.getElementById('volume-value'), drive = document.getElementById('drive'), driveValue = document.getElementById('drive-value'), space = document.getElementById('space'), spaceValue = document.getElementById('space-value');
    function setEffectControl(control, output, value, fallback) { control.value = value === undefined ? fallback : value; output.textContent = control.value; control.onchange = control.oninput = function () { output.textContent = control.value; }; }
    setEffectControl(volume, volumeValue, state.Volume, 90);
    setEffectControl(drive, driveValue, state.Drive, 0);
    setEffectControl(space, spaceValue, state.Space, 0);
    var bassCutoff = document.getElementById('bass-cutoff'), bassCutoffValue = document.getElementById('bass-cutoff-value'), bassBite = document.getElementById('bass-bite'), bassBiteValue = document.getElementById('bass-bite-value'), leadCutoff = document.getElementById('lead-cutoff'), leadCutoffValue = document.getElementById('lead-cutoff-value'), leadBite = document.getElementById('lead-bite'), leadBiteValue = document.getElementById('lead-bite-value');
    setEffectControl(bassCutoff, bassCutoffValue, state.BassAttack, 10);
    setEffectControl(bassBite, bassBiteValue, state.BassDecay, 50);
    setEffectControl(leadCutoff, leadCutoffValue, state.LeadAttack, 5);
    setEffectControl(leadBite, leadBiteValue, state.LeadDecay, 65);
    var targetNames = ['Drums', 'Bass', 'Lead'];
    function buildTargetControls(containerId, mask) {
      var container = document.getElementById(containerId), result = [], target, label, input;
      for (target = 0; target < targetNames.length; target++) {
        label = document.createElement('label'); input = document.createElement('input'); input.type = 'checkbox'; input.checked = (Number(mask) & (1 << target)) !== 0; input.setAttribute('data-target', target); label.appendChild(input); label.appendChild(document.createTextNode(targetNames[target])); container.appendChild(label); result.push(input);
      }
      return result;
    }
    var driveTargets = buildTargetControls('drive-targets', state.DriveTargets === undefined ? 7 : state.DriveTargets), spaceTargets = buildTargetControls('space-targets', state.SpaceTargets === undefined ? 7 : state.SpaceTargets);
    function targetMask(inputs) { var mask = 0, target; for (target = 0; target < inputs.length; target++) if (inputs[target].checked) mask |= 1 << target; return mask; }
    playing = Number(state.Transport) === 1;
    var transport = document.getElementById('transport');
    function renderTransport() { transport.textContent = playing ? 'Stop playback' : 'Start playback'; }
    renderTransport(); transport.onclick = function () { playing = !playing; transportTouched = true; renderTransport(); };
    var presets = {
      four: { patterns: [0x1111, 0x0404, 0x5555, 0x0000, 0x1111, 0x0000], notes: ['0000222200002222', '0000000000000000'], bpm: 120, effects: [90, 0, 10], shape: [80, 5, 90, 15], routing: [7, 7] },
      electro: { patterns: [0x1001, 0x0404, 0xaaaa, 0x0200, 0x1111, 0x8421], notes: ['0000222203334444', '0246024602460246'], bpm: 130, effects: [95, 45, 25], shape: [70, 25, 100, 45], routing: [3, 5] },
      melody: { patterns: [0x1111, 0x0404, 0x5555, 0x0000, 0x1111, 0x8421], notes: ['0000333302225555', '0134013401234013'], bpm: 110, effects: [88, 10, 45], shape: [75, 10, 85, 20], routing: [2, 6] }
    };
    function setButtonActive(target, active) { if (active && !hasClass(target, 'active')) toggleClass(target, 'active'); if (!active && hasClass(target, 'active')) toggleClass(target, 'active'); }
    function applyPreset(preset) {
      var presetTrack, presetStep, presetNotes;
      for (presetTrack = 0; presetTrack < sequenceRows.length; presetTrack++) {
        for (presetStep = 0; presetStep < 16; presetStep++) setButtonActive(sequenceRows[presetTrack].getElementsByTagName('button')[presetStep], (preset.patterns[presetTrack] & (1 << presetStep)) !== 0);
      }
      for (presetTrack = 0; presetTrack < 2; presetTrack++) {
        presetNotes = preset.notes[presetTrack].split(''); synthNotes[presetTrack] = presetNotes;
        for (presetStep = 0; presetStep < 16; presetStep++) pitchButtons[presetTrack][presetStep].textContent = noteNames[presetTrack][Number(presetNotes[presetStep])];
      }
      if (preset.bpm) { bpm.value = preset.bpm; tempo.textContent = bpm.value; }
      if (preset.effects) {
        setEffectControl(volume, volumeValue, preset.effects[0], 90);
        setEffectControl(drive, driveValue, preset.effects[1], 0);
        setEffectControl(space, spaceValue, preset.effects[2], 0);
      }
      if (preset.shape) {
        setEffectControl(bassCutoff, bassCutoffValue, preset.shape[0], 85); setEffectControl(bassBite, bassBiteValue, preset.shape[1], 10);
        setEffectControl(leadCutoff, leadCutoffValue, preset.shape[2], 95); setEffectControl(leadBite, leadBiteValue, preset.shape[3], 25);
      }
      if (preset.routing) {
        for (presetStep = 0; presetStep < 3; presetStep++) { driveTargets[presetStep].checked = (preset.routing[0] & (1 << presetStep)) !== 0; spaceTargets[presetStep].checked = (preset.routing[1] & (1 << presetStep)) !== 0; }
      }
    }
    document.getElementById('presets').onclick = function (event) {
      var choice = event.target.getAttribute('data-preset');
      if (choice && presets[choice]) applyPreset(presets[choice]);
    };
    document.getElementById('clear').onclick = function () { applyPreset({ patterns: [0, 0, 0, 0, 0, 0], notes: ['0000000000000000', '0000000000000000'] }); };
    function currentSettings() {
      var result = { Bpm: Number(bpm.value), Volume: Number(volume.value), Drive: Number(drive.value), Space: Number(space.value), BassAttack: Number(bassCutoff.value), BassDecay: Number(bassBite.value), LeadAttack: Number(leadCutoff.value), LeadDecay: Number(leadBite.value), DriveTargets: targetMask(driveTargets), SpaceTargets: targetMask(spaceTargets) }, rows = tracks.getElementsByClassName('track'), buttons, value, i, j, sequenceRow = 0;
      for (i = 0; i < rows.length; i++) { if (hasClass(rows[i], 'pitch')) continue; buttons = rows[i].getElementsByTagName('button'); value = 0; for (j = 0; j < buttons.length; j++) if (hasClass(buttons[j], 'active')) value |= (1 << Number(buttons[j].getAttribute('data-step'))); result[sequenceRow < 4 ? 'Pattern' + sequenceRow : 'Synth' + (sequenceRow - 4)] = value; sequenceRow++; }
      result.SynthNotes0 = synthNotes[0].join(''); result.SynthNotes1 = synthNotes[1].join('');
      if (transportTouched) result.Transport = playing ? 1 : 0;
      return result;
    }
    function saveToPebble() {
      var result = currentSettings();
      location.href = returnTo + encodeURIComponent(JSON.stringify(result));
    }
    document.getElementById('close').onclick = saveToPebble;
    if (cachedState) {
      var controls = document.getElementsByTagName('button'), control;
      for (var controlIndex = 0; controlIndex < controls.length; controlIndex++) controls[controlIndex].disabled = true;
      bpm.disabled = volume.disabled = drive.disabled = space.disabled = bassCutoff.disabled = bassBite.disabled = leadCutoff.disabled = leadBite.disabled = true;
      for (var targetIndex = 0; targetIndex < 3; targetIndex++) { driveTargets[targetIndex].disabled = true; spaceTargets[targetIndex].disabled = true; }
    }
  </script>
</body>
</html>
